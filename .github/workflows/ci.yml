name: Delivery CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: delivery-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate delivery controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate repository
        run: ./scripts/check.sh
      - name: Exercise complete promotion and rollback
        run: |
          ./scripts/demo.sh >/dev/null
          ./scripts/delivery.py rollback --environment production --state-dir .local/state >/dev/null

