name: Delivery CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: delivery-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate delivery controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate repository
        run: ./scripts/check.sh
      - name: Exercise complete promotion and rollback
        run: |
          ./scripts/demo.sh >/dev/null
          ./scripts/delivery.py rollback --environment production --state-dir .local/state >/dev/null

